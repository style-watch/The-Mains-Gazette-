<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F3;--card:#FFFFFF;--ink:#111827;--muted:#5B6474;--soft:#8A93A3;--line:#E8E3D8;--line2:#F1EDE4;
  --navy:#14213D;--navy2:#22335A;--saffron:#D97706;--saffron2:#F59E0B;
  --ideas:#4F46E5;--kw:#B45309;--data:#0F766E;--ex:#BE185D;
  --gs1:#0E7490;--gs2:#4338CA;--gs3:#15803D;--gs4:#9D174D;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:16px;--shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--saffron2);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(250,248,243,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none}
.brand svg{width:38px;height:38px}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-family:var(--serif);font-weight:700;font-size:1.42rem;letter-spacing:-.01em;color:var(--navy)}
.word small.pre{margin:0 0 1px;font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--saffron);display:block}
.word b i{font-style:normal;color:var(--saffron)}
.word small{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav.main{margin-left:auto;display:flex;gap:4px;align-items:center}
nav.main a{text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:10px;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:center}
nav.main a:hover{color:var(--ink);background:#fff}
nav.main a[aria-current=page]{color:var(--navy);background:#fff;box-shadow:inset 0 -2px 0 var(--saffron)}
nav.main .n{font-family:var(--mono);font-size:.7rem;background:var(--navy);color:#fff;border-radius:99px;padding:1px 7px}
.tabbar{display:none}
@media (max-width:820px){
  nav.main{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current=page]{color:var(--navy);background:var(--paper)}
  body{padding-bottom:76px}
  .word small{display:none}
}

/* ethics casebook */
.ecase{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gs4);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ecase .ar{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gs4);font-weight:600}
.ecase h4{margin:0;font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.3}
.ecase p{margin:0;font-size:.92rem;color:#374151}
.ecase .nw{font-size:.95rem;color:#1F2937}
.ecase .sl{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:.88rem;align-items:baseline}
.ecase .sl b{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gs4)}
.ecase .sl a{color:var(--navy);font-weight:600}
.ecase .pq2{background:#FDF2F8;border-radius:10px;padding:9px 12px}
.ecase .pq2 b{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gs4)}
.ecase .pq2 p{margin:3px 0 0;font-size:.93rem;color:#111827;font-weight:500}
.asked2{font-size:.85rem}.asked2 summary{cursor:pointer;font-weight:600;color:var(--muted)}
.asked2 ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}.asked2 li{display:grid;gap:2px}
@media (max-width:600px){.ecase .sl{grid-template-columns:1fr;gap:0}}
.ecase .ls{background:#FDF2F8;border-radius:8px;padding:8px 10px;font-size:.9rem}
.ecase .ls b{color:var(--gs4)}
.ecase .vs{display:flex;flex-wrap:wrap;gap:6px}
.ecase .vs span{font-size:.74rem;font-weight:600;background:#F3F4F6;border-radius:99px;padding:3px 9px;color:#374151}
.ecase .ft2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line)}
.ecase .src{font-size:.76rem;color:var(--soft)}
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.egrid{grid-template-columns:1fr}}
.eband{margin-top:34px;padding:20px;border-radius:18px;background:#FDF2F8;border:1px solid #FBCFE8}
.eband .secth{margin:0 0 14px}
.eband .secth h2{color:var(--gs4)}
.cbk{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#FDF2F8;border:1px solid #FBCFE8;border-radius:16px;padding:14px 18px;margin-bottom:18px;text-decoration:none;color:inherit}
.cbk b{font-family:var(--serif);font-size:1.15rem;color:var(--gs4)}
.cbk span{font-size:.9rem;color:#374151}
.egrp{margin-top:26px}
.egrp h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 4px;color:var(--gs4)}
.egrp .gd{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.where{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:#F5F7FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.84rem;color:#374151}
.where svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--navy)}
.where b{color:var(--navy)}
.where a{color:var(--saffron);font-weight:600}
.news{margin-top:10px;background:#FFFDF8;border-left:4px solid var(--navy);border-radius:0 10px 10px 0;padding:10px 14px}
.news p{margin:4px 0 0;font-size:1rem;line-height:1.6;color:#1F2937}
.lbl2{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);font-weight:700}
.evo{margin-top:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.evo ol{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid #F8BF6B;display:grid;gap:6px}
.evo li{position:relative;display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:10px;font-size:.88rem}
.evo li::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--saffron);border:2px solid #fff}
.evo li b{color:var(--navy);font-family:var(--mono);font-size:.76rem;padding-top:2px}
@media (max-width:600px){.evo li{grid-template-columns:1fr;gap:0}}
.app{display:block;margin-top:5px}
.app .tg{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#92400E;background:#FDECC8;border-radius:5px;padding:2px 6px;margin-bottom:3px}
.card .app .wr{display:block;font-family:Inter,system-ui,sans-serif;font-size:.86rem;line-height:1.45;color:#1F2937;border-left:3px solid var(--saffron);padding:2px 0 2px 9px;font-style:italic}
.card .app .wr b{font-style:normal;color:#B45309;font-weight:700;margin:0;display:inline;font-size:.8rem}
.use{display:block;margin-top:3px;font-size:.8rem;color:#6B4E16;background:#FFF8EC;border-radius:6px;padding:3px 8px}
.card .use b{color:#B45309;font-weight:700;font-family:Inter,system-ui,sans-serif;font-size:.8rem;margin:0;display:inline}
.card .use{font-family:Inter,system-ui,sans-serif;font-size:.8rem;font-weight:400}
.fig .use{margin-top:5px}
.il{margin:0;padding-left:20px;display:grid;gap:10px}
.il li span:first-child{font-size:.93rem}
.kwi{padding:7px 0;border-top:1px dashed var(--line)}
.kwi:first-of-type{border-top:0}
.kwi b{color:#92400E;margin-right:6px}
.kwi>span{font-size:.88rem;color:#374151}
.case summary{cursor:pointer;list-style:none}.case summary::-webkit-details-marker{display:none}.case summary b{color:var(--saffron);white-space:nowrap}.case[open] summary{display:none}.case div{white-space:pre-line}
/* home: the front page */
.fp{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:-56px;position:relative;z-index:2}
.fp.fp2{margin-top:20px}
.door.sm{padding:20px 24px;gap:10px}.door.sm h2{font-size:1.4rem}.door.sm .dk i{width:40px;height:40px}
.door{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 26px;box-shadow:0 18px 40px rgba(20,33,61,.12);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.door::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--dc,var(--saffron))}
.door .dk{display:flex;align-items:center;gap:12px}
.door .dk i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--dc,var(--navy));color:#fff;flex:none}
.door .dk i svg{width:24px;height:24px}
.door h2{margin:0;font-family:var(--serif);font-size:1.7rem;line-height:1.15}
.door .dsub{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.door p{margin:0;color:#374151;font-size:.98rem}
.door ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.door li a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:#111827;padding:6px 8px;border-radius:8px;font-size:.92rem}
.door li a:hover{background:var(--paper)}
.door li a span{font-family:var(--mono);font-size:.7rem;color:var(--soft);flex:none}
.door .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.door .go a.btn{font-size:1rem;padding:12px 20px}
.door .go small{color:var(--muted);font-size:.8rem}
.door .chips2{display:flex;flex-wrap:wrap;gap:6px}
.door .chips2 a{font-size:.8rem;font-weight:600;text-decoration:none;background:#EEF1F8;color:var(--navy);border-radius:99px;padding:5px 10px}
.also{margin-top:26px}
.also h2{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.also ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.also a{display:flex;gap:12px;align-items:flex-start;height:100%;box-sizing:border-box;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.also a:hover{border-color:var(--saffron)}
.also a i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.also a i svg{width:18px;height:18px}
.also b{display:block;font-size:.95rem}
.also span{font-size:.82rem;color:var(--muted)}
.why3{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.why3 div{background:linear-gradient(135deg,#FFF8EC,#FDF2F8);border:1px solid #F8D9A8;border-radius:14px;padding:14px 16px}
.why3 b{display:block;color:var(--navy);margin-bottom:3px}
.why3 span{font-size:.88rem;color:#4B5563}
@media (max-width:900px){.fp{grid-template-columns:1fr;margin-top:-40px}.fp.fp2{margin-top:16px}.also ul{grid-template-columns:1fr 1fr}.why3{grid-template-columns:1fr}}
@media (max-width:480px){.also ul{grid-template-columns:1fr}.door h2{font-size:1.45rem}}

/* almanac landing, paper pages, compiled notes */
.pnote{margin:0 0 14px;color:#374151;font-size:.92rem}.pnote strong{color:var(--navy)}
.papers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.paper{display:flex;flex-direction:column;gap:8px;height:100%;box-sizing:border-box;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);transition:transform .15s}
.paper:hover,.paper:focus-visible{transform:translateY(-2px);border-color:var(--saffron)}
.papers li:nth-child(1) .paper{border-top-color:var(--gs1)}.papers li:nth-child(2) .paper{border-top-color:var(--gs2)}.papers li:nth-child(3) .paper{border-top-color:var(--gs3)}.papers li:nth-child(4) .paper{border-top-color:var(--gs4)}.paper.essay{border-top-color:#7C3AED}
.paper .pn{font-family:var(--serif);font-size:1.6rem;font-weight:600}
.paper .pd{color:#374151;font-size:.95rem}
.paper .pm{margin-top:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.tlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.tlist a{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tlist a:hover,.tlist a:focus-visible{border-color:var(--saffron)}
.tlist .tn2{font-weight:600;font-size:1rem}
.tlist .tm{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.tlist .tm b{color:var(--navy)}
.cday{margin-bottom:22px}
.cdate{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;padding-bottom:6px;border-bottom:3px double var(--navy)}
.cdate a{color:var(--navy);text-decoration:none}
.keep{background:#fff;border:1px solid var(--line);border-left:5px solid var(--saffron);border-radius:16px;padding:14px 18px;margin:0 0 20px;box-shadow:var(--shadow)}
.keep .kh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.keep .kh span{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.keep ul{margin:8px 0 12px;padding-left:18px;font-size:.9rem;color:#374151;display:grid;gap:4px}
.keep .kb{display:flex;flex-wrap:wrap;gap:8px}
#rsbox{margin-top:12px;font-size:.88rem}
.rsrow{display:flex;gap:8px;margin-top:6px}.rsrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.traj{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 18px;box-shadow:var(--shadow)}
.trh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.trh h2{margin:0;font-family:var(--serif);font-size:1.25rem}
.trh span{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.traj ol{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--saffron);display:grid;gap:12px}
.traj li{position:relative;display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:baseline}
.traj li::before{content:'';position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--saffron)}
.traj time{font-family:var(--mono);font-size:.74rem;color:var(--saffron);font-weight:600}
.traj li a{font-weight:600;color:var(--ink,#111827);text-decoration:none}.traj li a:hover{text-decoration:underline}
.traj li span{display:block;font-size:.88rem;color:#4B5563;margin-top:2px}
.traj .tm{margin:0 0 10px}.traj .tm summary{cursor:pointer;font-weight:600;font-size:.92rem;margin-bottom:8px}.traj .tm summary span{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:6px}
.tnote{margin:10px 0 0;font-size:.8rem;color:var(--soft)}
@media (max-width:600px){.traj li{grid-template-columns:1fr;gap:0}}
.issue{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.issue h4{margin:0 0 6px;font-family:var(--serif);font-size:1.2rem;font-weight:600}
.issue .one{margin:0 0 10px;font-size:.95rem;color:#1F2937}
.issue .one b{color:var(--saffron)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.cgrid>div{display:grid;gap:12px;align-content:start;min-width:0}
.cgrid>div+div{border-left:1px solid var(--line2);padding-left:24px}
.cl h5{margin:0 0 4px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.cl h5 i{width:18px;height:18px;border-radius:5px;color:#fff;display:grid;place-items:center;font-style:normal;font-size:.64rem}
.cl ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.9rem}
.cl .u2{display:block;font-size:.78rem;color:#92400E}
.issue .src2{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}.cgrid>div+div{border-left:0;padding-left:0}.tlist{grid-template-columns:1fr}}
.edlist{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.edlist a{display:inline-flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.edlist a[aria-current="true"]{background:var(--navy);color:#fff}
.edlist a span{font-weight:400;font-size:.78rem;opacity:.8}

/* newspaper article layout for Morning Edition stories */
.art{padding:26px 30px 0;border-top:4px solid var(--navy)}
.art .kick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.art .kick .path{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.art .hl{margin:10px 0 10px;font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2.15rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.art .stand{margin:0;font-family:var(--serif);font-size:1.12rem;line-height:1.6;color:#1F2937}
.art .stand::before{content:'In one line';display:inline-block;margin-right:10px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--saffron);border-radius:6px;padding:3px 7px;vertical-align:3px}
.art .byl{margin:12px 0 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
.art .byl a{color:var(--saffron);font-weight:600}
.sofar{margin:16px 0 0;background:#F8FAFC;border-left:4px solid var(--saffron);border-radius:0 12px 12px 0;padding:12px 16px}

/* common */
section.block{padding:30px 0}

.ft{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:#FCFBF8}
.tlinks{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tlink{font-size:.8rem;font-weight:600;text-decoration:none;color:var(--navy);background:#EEF1F8;border-radius:8px;padding:3px 9px}

<script>
(function(){
'use strict';
const MM=window.MM;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YEARS=MM.meta.years;
const TH={};MM.themes.forEach((t,i)=>{TH[t.k]=t;t.i=i;
  t.byYear=YEARS.map(y=>t.q.filter(id=>MM.pyq[id][1]===y).length);
  t.yrs=t.byYear.filter(Boolean).length;
  t.recent=t.byYear.slice(-5).filter(Boolean).length; // years asked among last 5 papers
  t.score=t.yrs*10+t.recent*6+t.q.length;
});
const ranked=[...MM.themes].sort((a,b)=>b.score-a.score);ranked.forEach((t,i)=>t.rank=i+1);
function prio(t){return t.yrs>=13?3:(t.yrs>=10?2:1)}
const PRIO=['','Steady','High','Top'];
function lvl(n){return n>=4?4:n>=3?3:n>=2?2:n>=1?1:0}

// ---- data: loaded on demand.
// editions/<date>.json holds one day; data/themes/<k>.json holds a theme's stories from every day;
// data/index.json is a small summary (editions list, counts). Nothing large is downloaded up front.
let IDX={latest:null,editions:[],themes:{},areas:{},essay:{},totals:{stories:0,cases:0,essay:0}};
const D={editions:[]};          // editions loaded so far (full day files)
const ITEMS=[],CASES=[],FOD=[];  // every story, case and essay piece loaded so far
const TFILE={},AFILE={},EFILE={};// theme, ethics-area and essay-theme files loaded so far
const _got={};
function getJSON(u){if(!_got[u])_got[u]=fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()}).catch(e=>{delete _got[u];throw e});return _got[u]}
function edRef(o){let ed=D.editions.find(e=>e.date===o.date);if(!ed){ed=IDX.editions.find(e=>e.date===o.date)||{date:o.date,paper:o.paper};}return ed}
function regItem(it,ed){const ex=ITEMS.find(x=>x.id===it.id);if(ex)return ex;it._ed=ed;ITEMS.push(it);return it}
function regCase(c,ed){const ex=CASES.find(x=>x.id===c.id);if(ex)return ex;c._ed=ed;c._id=c.id;CASES.push(c);return c}
function regFod(f,ed){const ex=FOD.find(x=>x.id===f.id);if(ex)return ex;f._ed=ed;FOD.push(f);return f}
async function loadIndex(){try{IDX=await getJSON('data/index.json')}catch(e){}}
async function loadDay(date){
  if(!date)return null;let ed=D.editions.find(e=>e.date===date&&e.items);if(ed)return ed;
  const j=await getJSON('editions/'+date+'.json');
  ed={date:j.date,paper:j.paper};
  ed.items=(j.items||[]).map(it=>regItem(it,ed));
  ed.ethics=(j.ethics||[]).map(c=>regCase(c,ed));
  ed.essay=(j.essay||[]).map(f=>regFod(f,ed));
  // stories met earlier through a theme file now point to the full edition
  [ITEMS,CASES,FOD].forEach(A=>A.forEach(x=>{if(x._ed&&x._ed.date===date)x._ed=ed}));
  D.editions=D.editions.filter(e=>e.date!==date).concat(ed).sort((a,b)=>b.date<a.date?-1:1);
  return ed;
}
// A folder holds one file per month; fetch every month listed in the index, in parallel.
async function loadFolder(dir,k,kind){const ms=Object.keys(((IDX.months||{})[kind]||{})[k]||{}).sort().reverse();
  const parts=await Promise.all(ms.map(m=>getJSON(`data/${dir}/${k}/${m}.json`)));return [].concat(...parts)}
async function loadTheme(k){if(TFILE[k])return TFILE[k];if(!IDX.themes[k])return TFILE[k]=[];
  const l=await loadFolder('themes',k,'themes');return TFILE[k]=l.map(x=>k.startsWith('g4')?regCase(x,edRef(x)):regItem(x,edRef(x)))}
async function loadArea(a){if(AFILE[a])return AFILE[a];if(!IDX.areas[a])return AFILE[a]=[];
  const l=await loadFolder('ethics',a,'areas');return AFILE[a]=l.map(x=>regCase(x,edRef(x)))}
async function loadEssay(k){if(EFILE[k])return EFILE[k];if(!IDX.essay[k])return EFILE[k]=[];
  const l=await loadFolder('essay',k,'essay');return EFILE[k]=l.map(x=>regFod(x,edRef(x)))}
const latestEd=()=>D.editions.find(e=>e.date===IDX.latest)||null;

// ---- storage (per viewer, optional)
const store={get(k,d){try{const v=localStorage.getItem('mm-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mm-'+k,JSON.stringify(v))}catch(e){}}};
let SAVED=new Set(store.get('saved',[]));

// ---- icons
const IC={
 dossier:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
 vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>',
 map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 saved:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',

// ---- hero background: a gently drifting grid of matrix cells
function fx(){
  const c=$('#fx');if(!c)return;const ctx=c.getContext('2d');let w,h,cells=[],raf;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const r=c.getBoundingClientRect();w=c.width=r.width*devicePixelRatio;h=c.height=r.height*devicePixelRatio;cells=[];const s=34*devicePixelRatio;
    for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){if(Math.random()<.16)cells.push({x,y,s:s*.62,p:Math.random()*6.28,v:.004+Math.random()*.01,c:Math.random()<.18?'245,158,11':'255,255,255'})}}
  function draw(){ctx.clearRect(0,0,w,h);for(const k of cells){k.p+=k.v;const a=(Math.sin(k.p)+1)/2*.22+.03;ctx.fillStyle=`rgba(${k.c},${a})`;const r=4*devicePixelRatio;ctx.beginPath();ctx.roundRect?ctx.roundRect(k.x,k.y,k.s,k.s,r):ctx.rect(k.x,k.y,k.s,k.s);ctx.fill()}if(!reduce)raf=requestAnimationFrame(draw)}
  size();draw();window.addEventListener('resize',()=>{cancelAnimationFrame(raf);size();draw()},{once:true});
}

function askedFor(it){
  const seen=new Set(),out=[];
  (it.themes||[]).forEach(k=>{const t=TH[k];if(!t)return;t.q.forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id)}})});
  out.sort((a,b)=>MM.pyq[b][1]-MM.pyq[a][1]);return out;
}
function norm(it){
  // optional last value in each entry: a ready-to-write sentence for the answer
  const I=(it.ideas||[]).map(x=>Array.isArray(x)?[x[0],x[1]||'',x[2]||'']:[x,'','']);
  const K=(it.keywords||[]).map(x=>[x[0],x[1]||'',x[2]||'',x[3]||'']);
  const Dt=(it.data||[]).map(x=>[x[0],x[1]||'',x[2]||'',x[3]||'',x[4]||'']);
  const E=(it.examples||[]).map(x=>[x[0],x[1]||'',x[2]||'',x[3]||'',x[4]||'']);
  return {I,K,Dt,E};
}

// ---- Practice questions (editor's), in UPSC pattern, with model answers hidden until asked for.
// it.practice = [{q, marks, words, parts:["part 1", ...], answer:[{h:"Introduction", t:"..."} | {h:"Part heading", pts:["..."]}]}]
// it.trend = {t: "brief reading of how these questions have moved", focus: ["where the next question may come from", ...]}
function trendHTML(it){const T=it.trend;if(!T)return '';return `<div class="trend"><h5 class="lh">The Trendline <span>How these questions have moved</span></h5><p>${esc(T.t)}</p>${(T.focus||[]).length?`<b>Where the next question may come from:</b><ul>${T.focus.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}</div>`}
// it.potential = ["possible question", ...]; it.practice = one question with a model answer
function practiceHTML(it){
  const P=it.practice||[],Q=it.potential||[];if(!P.length&&!Q.length)return '';
  return `<div class="prac">${Q.length?`<h5 class="lh">On the Radar <span>Questions to watch, in UPSC's pattern</span></h5><ol class="potq">${Q.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:''}${P.length?`<h5 class="lh">The Answer Desk <span>Write it, then check the model answer</span></h5>`:''}${P.map((x,i)=>`<div class="pq3">
   <div class="pqh"><span class="tag2">Practice question (editor's)</span><span class="code">${x.marks||10} marks · ${x.words||(x.marks==15?250:150)} words</span></div>
   <p class="pqq">${esc(x.q)}</p>
   ${(x.parts||[]).length?`<div class="flow"><b>The parts of this question:</b><ol>${x.parts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>`:''}
   <details class="model"><summary>Show model answer (editor's) · try it yourself first</summary>
    ${(x.answer||[]).map(sec=>`<div class="ms"><h6>${esc(sec.h)}</h6>${sec.t?`<p>${esc(sec.t)}</p>`:''}${(sec.pts||[]).length?`<ul>${sec.pts.map(ptHTML).join('')}</ul>`:''}${(sec.flow||[]).length?flowHTML(sec.flow):''}</div>`).join('')}
    <button class="btn" data-pcopy="${esc(it.id)}|${i}">${IC.copy}Copy question and answer</button>
   </details></div>`).join('')}
   <div class="nt">Practice questions and model answers are written by the editor in UPSC's pattern; they are not UPSC questions. Facts come from the day's news and well-established sources.</div></div>`;
}
// a point is a string, or {k: key phrase, t: explanation, ex: example}
function ptHTML(pt){if(typeof pt==='string')return `<li>${esc(pt)}</li>`;return `<li><b>${esc(pt.k)}:</b> ${esc(pt.t)}${pt.ex?`<span class="eg"><i>Example:</i> ${esc(pt.ex)}</span>`:''}</li>`}
function ptText(pt){return typeof pt==='string'?pt:pt.k+': '+pt.t+(pt.ex?' Example: '+pt.ex:'')}
// a simple diagram: boxes joined by arrows (sec.flow = ["step 1","step 2",...])
function flowHTML(f){return `<div class="dgm" role="img" aria-label="${esc(f.join(' leads to '))}">${f.map(x=>`<span>${esc(x)}</span>`).join('<i aria-hidden="true">→</i>')}</div>`}
function practiceText(it,i){const x=(it.practice||[])[i];if(!x)return '';const L=['PRACTICE QUESTION (editor\'s) · '+(x.marks||10)+' marks',x.q,''];
  if((x.parts||[]).length){L.push('Parts: '+x.parts.join(' | '),'')}
  (x.answer||[]).forEach(sec=>{L.push(sec.h.toUpperCase());if(sec.t)L.push(sec.t);(sec.pts||[]).forEach(pt=>L.push('• '+ptText(pt)));if((sec.flow||[]).length)L.push('['+sec.flow.join(' → ')+']');L.push('')});return L.join('\n')}
function srcFlag(id){const p=MM.pyq[id];return p&&p[5]===1?' <sup title="Found in one compilation only">¹</sup>':''}
function qHTML(id){const p=MM.pyq[id];if(!p)return '';const t=qtext(id);if(p[6]&&t.length>260)return `<details class="case"><summary>${esc(t.slice(0,220))}… <b>Read the full case</b></summary><div>${esc(t)}</div></details>`;return esc(t)}
function qtext(id){const p=MM.pyq[id];return p?(p[4]||p[3]):''}
const PYQNOTE="Questions are reproduced in UPSC's exact wording, cross-checked against independent published copies of the papers. The 'Use it' lines are the editor's suggestions.";
function notesText(it){
  const L=[];L.push(it.title.toUpperCase());L.push(`${(it.gs||[]).join(', ')} | ${it.syllabus||''}`);L.push(`${it.paper||it._ed.paper||''}${it.where?', '+it.where:''}, ${fmtDate(it._ed.date)}`);
  const {I,K,Dt,E}=norm(it);const U=(u,w)=>w?'\n  ['+u+'] Write: '+w:(u?' [Use in: '+u+']':'');
  if(it.summary)L.push('\nTHE NEWS\n'+it.summary);
  if((it.evolution||[]).length){L.push('\nHOW IT HAS EVOLVED');it.evolution.forEach(e=>L.push('• '+e[0]+': '+e[1]))}
  if(I.length){L.push('\nIDEAS');I.forEach(x=>L.push('• '+x[0]+U(x[1],x[2])))}
  if(K.length){L.push('\nKEYWORDS');K.forEach(x=>L.push('• '+x[0]+(x[1]?' — '+x[1]:'')+U(x[2],x[3])))}
  if(Dt.length){L.push('\nDATA');Dt.forEach(x=>L.push('• '+x[0]+' — '+x[1]+(x[2]?' ('+x[2]+')':'')+U(x[3],x[4])))}
  if(E.length){L.push('\nEXAMPLES');E.forEach(x=>L.push('• '+x[0]+(x[2]==='GS4'?' [GS4]':'')+(x[1]?' — '+x[1]:'')+U(x[3],x[4])))}
  if(it.trend){L.push('\nTREND IN PAST QUESTIONS\n'+it.trend.t);(it.trend.focus||[]).forEach(f=>L.push('• '+f))}
  if((it.potential||[]).length){L.push('\nPOTENTIAL QUESTIONS');it.potential.forEach(q=>L.push('• '+q))}
  (it.practice||[]).forEach((x,i)=>L.push('\n'+practiceText(it,i)));
  if(it.pyqs&&it.pyqs.length){L.push('\nASKED BEFORE IN MAINS');it.pyqs.forEach(p=>{if(MM.pyq[p[0]])L.push('• '+code(p[0])+': '+qtext(p[0])+'\n  Use it: '+p[1])})}
  L.push('\nThemes: '+(it.themes||[]).filter(k=>TH[k]).map(k=>TH[k].n).join('; '));
  return L.join('\n');
}

}

    const a=document.querySelector('[data-tab="pyq"]');if(a)a.onclick=e=>{e.preventDefault();show('pyq')};
  }

// ---- Clippings backup: the list of clipped story ids, packed into a short link.
// 2026-10-27-04, 2026-10-27-07 -> "20261027.04.07"; days joined by "~".
function packClips(ids){const by={};[...ids].forEach(id=>{const m=String(id).match(/^(\d{4})-(\d{2})-(\d{2})-(\w+)$/);if(m)(by[m[1]+m[2]+m[3]]=by[m[1]+m[2]+m[3]]||[]).push(m[4])});
  return Object.keys(by).sort().map(d=>d+'.'+by[d].sort().join('.')).join('~')}
function unpackClips(code){const out=[];String(code||'').split('~').forEach(g=>{const p=g.split('.');const d=p.shift();if(!/^\d{8}$/.test(d))return;p.forEach(n=>{if(/^\w+$/.test(n))out.push(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}-${n}`)})});return out}
function backupLink(){return SHARE_URL+'#restore='+packClips(SAVED)}
function codeFrom(txt){txt=String(txt||'').trim();const m=txt.match(/restore=([0-9A-Za-z.~]+)/);return m?m[1]:txt.replace(/[^0-9A-Za-z.~]/g,'')}

     <li>Clearing browser data, private/incognito tabs or a new phone will lose them, so send yourself a backup now and then.</li>
    </ul>
    <div class="kb">${SAVED.size?`<a class="btn pri" id="bk-wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg())}">Back up to WhatsApp</a>
     <a class="btn" id="bk-tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(backupLink())}&text=${encodeURIComponent('My Mains Gazette clippings ('+SAVED.size+'). Open the link to restore them.')}">Back up to Telegram</a>
     <button class="btn" id="bk-copy" type="button">${IC.copy}Copy backup link</button>`:''}
     <button class="btn" id="bk-rs" type="button" aria-expanded="false" aria-controls="rsbox">Restore from a backup</button></div>
    <div id="rsbox" hidden><label for="rsin">Paste your backup link (or open the link itself on this phone):</label><div class="rsrow"><input id="rsin" type="text" inputmode="url" autocomplete="off" placeholder="https://style-watch.github.io/The-Mains-Gazette-/#restore=…"><button class="btn pri" id="rsgo" type="button">Restore</button></div></div>
   </div>
   ${items.length?`<div class="cards">${items.map(cardHTML).join('')}</div>`:`<div class="nothing">No clippings yet. Use <b>Clip</b> on any Morning Edition story.</div>`}</section></div>`;fx();
  const c=$('#bk-copy');if(c)c.onclick=()=>copy(backupLink());
  $('#bk-rs').onclick=e=>{const b=$('#rsbox');b.hidden=!b.hidden;e.currentTarget.setAttribute('aria-expanded',String(!b.hidden));if(!b.hidden)$('#rsin').focus()};

  $('#rsgo').onclick=go;$('#rsin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

// Opening a backup link: show what will be restored, then merge (never deletes existing clippings).

  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap"><div class="eyebrow">Clippings · restore</div><h1>Restore your clippings.</h1><p class="sub">${ids.length?`This backup has ${ids.length} clipped ${ids.length===1?'story':'stories'}${fresh.length<ids.length?`; ${ids.length-fresh.length} already on this phone`:''}. Restoring adds them to the clippings here and removes nothing.`:'This backup link is empty or damaged.'}</p></div></div><div class="wrap"><section class="block">
   ${ids.length?`<p><button class="btn pri" id="rsok" type="button">Restore ${fresh.length||ids.length} ${(fresh.length||ids.length)===1?'clipping':'clippings'}</button> <a class="btn" href="#clippings">Cancel</a></p>`:`<p><a class="btn" href="#clippings">Back to Clippings</a></p>`}
  </section></div>`;fx();
  const ok=$('#rsok');if(ok){ok.focus();ok.onclick=()=>{ids.forEach(id=>SAVED.add(id));store.set('saved',[...SAVED]);toast(`Restored ${fresh.length} ${fresh.length===1?'clipping':'clippings'}`);location.hash='#clippings'}}
}

function compiledText(t,items){

   <div class="wall">${years.map(y=>{const ids=Object.keys(E.topics).filter(id=>E.topics[id][0]===y);const col=sec=>ids.filter(id=>E.topics[id][1]===sec).map(id=>`<li>${esc(E.topics[id][2])} ${E.topics[id][3].map(k=>`<a href="#essay-${k}">${esc(ETH[k]?ETH[k].n.split(/[,:&]/)[0]:k)}</a>`).join('')}</li>`).join('');return `<div class="wyr"><b>${y}</b><div><h5>SECTION A</h5><ul>${col('A')}</ul></div><div><h5>SECTION B</h5><ul>${col('B')}</ul></div></div>`}).join('')}</div>
  </section></div>`;
  fx();
  let ty='All';const run=()=>{const th=$('#eth').value;document.querySelectorAll('#fod .fd').forEach(c=>{c.hidden=!((ty==='All'||c.dataset.ty===ty)&&(!th||c.dataset.th.split(' ').includes(th)))})};
  $('#ety').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;ty=b.dataset.t;document.querySelectorAll('#ety .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));run()});
  $('#eth').addEventListener('change',run);
}
function viewEssayPaper(){
  lastPaper='essay';
  const rk=[...E.themes].sort((a,b)=>b.score-a.score);
  const cnt=k=>IDX.essay[k]||0;
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap thhead">
    <a class="back" href="#almanac">← The Almanac</a>
    <h1>Essay</h1><div class="pl">Essay themes ranked by how often UPSC has asked them since 2020. Each theme collects the essay material from every edition.</div>
    <div class="stats"><div><b>${E.themes.length}</b><span>essay themes</span></div><div><b>${Object.keys(E.topics).length}</b><span>past topics, 2013–2026</span></div><div><b>${IDX.totals.essay}</b><span>pieces of material filed</span></div></div>
  </div></div><div class="wrap"><section class="block">
   <p class="pnote">Press Enter on a theme to see its past topics and every story, quote and example filed under it. <a href="#essay">Open The Essay Column →</a></p>
   <ol class="tlist">${rk.map(t=>{const n=cnt(t.k);return `<li><a href="#essay-${t.k}"><span class="tn2">${esc(t.n)}</span><span class="prio p${t.newQ.length>=10?3:t.newQ.length>=6?2:1}">${t.newQ.length>=10?'Top':t.newQ.length>=6?'High':'Steady'}</span><span class="tm">${t.newQ.length} topics since 2020 · ${t.oldQ.length} before · ${n?`<b>${n} ${n===1?'piece':'pieces'} of material</b>`:'no material yet'}</span></a></li>`}).join('')}</ol>
  </section></div>`;fx();
}
function viewEssayTheme(k){
  const t=ETH[k];if(!t){location.hash='#essay';return}
  const items=(EFILE[k]||[]).slice().sort((a,b)=>a._ed.date<b._ed.date?-1:1);
  const li=ids=>ids.sort((a,b)=>E.topics[b][0]-E.topics[a][0]).map(id=>`<li style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2)"><span class="code">${E.topics[id][0]}${E.topics[id][1]!=='-'?' · '+E.topics[id][1]:''}</span><span>${esc(E.topics[id][2])}</span></li>`).join('');
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap thhead">
   ${lastPaper==='essay'?'<a class="back" href="#paper-essay">← The Almanac · Essay</a>':'<a class="back" href="#essay">← The Essay Column</a>'}<h1>${esc(t.n)}</h1><div class="pl">${esc(t.d)}</div>
   <div class="stats"><div><b>${t.newQ.length}</b><span>topics since 2020</span></div><div><b>${t.oldQ.length}</b><span>topics 2013–2019</span></div><div><b>${items.length}</b><span>pieces of material</span></div><div><b>#${[...E.themes].sort((a,b)=>b.score-a.score).indexOf(t)+1}</b><span>rank of ${E.themes.length}</span></div></div>
  </div></div><div class="wrap"><section class="block">
   <div class="note" style="margin-bottom:18px"><b>How to approach it</b><p>${esc(t.tip)}</p></div>
   <div class="sheet"><div class="box"><h4 style="color:var(--saffron)">Asked since 2020</h4><ul style="list-style:none;margin:0;padding:0">${li(t.newQ.slice())||'<span class="code">—</span>'}</ul></div>
   <div class="box"><h4 style="color:var(--muted)">Asked 2013–2019</h4><ul style="list-style:none;margin:0;padding:0;opacity:.8">${li(t.oldQ.slice())||'<span class="code">—</span>'}</ul></div></div>
   <div class="secth"><h2>Material collected</h2><span>Newest first, from each day's paper</span></div>
   <div class="fod" id="efod">${items.slice().reverse().slice(0,30).map(fodHTML).join('')||'<div class="nothing">Nothing filed under this theme yet.</div>'}</div>${items.length>30?`<p style="text-align:center"><button class="btn" id="emore">Show earlier material (${items.length-30} more)</button></p>`:''}
  </section></div>`;fx();
  let shown=30;const em=$('#emore');if(em)em.onclick=()=>{shown+=30;$('#efod').innerHTML=items.slice().reverse().slice(0,shown).map(fodHTML).join('');if(shown>=items.length)em.remove();else em.textContent=`Show earlier material (${items.length-shown} more)`};
}

// ---- global clicks: save, copy, keyword definitions
function copy(txt){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied to clipboard')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy not available here')}ta.remove()})}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-save]');if(s){const id=s.dataset.save;SAVED.has(id)?SAVED.delete(id):SAVED.add(id);store.set('saved',[...SAVED]);s.setAttribute('aria-pressed',SAVED.has(id));s.innerHTML=IC.saved+(SAVED.has(id)?'Clipped':'Clip');toast(SAVED.has(id)?'Clipped for revision':'Removed from Clippings');nav(cur);return}
  const cc=e.target.closest('[data-ccopy]');if(cc){const c=CASES.find(x=>x._id===cc.dataset.ccopy);if(c)copy(c.syllabus?`GS4 ETHICS · ${(EAREA[c.area]||[c.area])[0]}\n${c.title}\n${c.news}\nSyllabus: ${c.syllabus}\nConnection: ${c.link}\nPractice question: ${c.question}\n${(c.pyq||[]).filter(id=>MM.pyq[id]).map(id=>'Asked before: '+code(id)+': '+qtext(id)).join('\n')}\nKeywords: ${(c.keywords||[]).join(', ')}\n(${c.src}, ${fmtDate(c._ed.date)})`:`GS4 ETHICS · ${(EAREA[c.area]||[c.area])[0]}\n${c.title}\n${c.case}\nEthical lesson: ${c.lesson}\nValues: ${(c.values||[]).join(', ')}\n(${c.src}, ${fmtDate(c._ed.date)})`);return}
  const dc=e.target.closest('[data-case]');if(dc){viewCasebook.focus=dc.dataset.case}
  const ec=e.target.closest('[data-ecopy]');if(ec){const it=FOD.find(x=>x.id===ec.dataset.ecopy);if(it)copy(`${it.type.toUpperCase()}: ${it.title}\n${it.text}\nUse it for: ${it.use}\n(${it.src}, ${fmtDate(it._ed.date)})`);return}
  const pc=e.target.closest('[data-pcopy]');if(pc){const [id,i]=pc.dataset.pcopy.split('|');const it=ITEMS.find(x=>x.id===id);if(it)copy(practiceText(it,+i));return}
  const c=e.target.closest('[data-copy]');if(c){const it=ITEMS.find(x=>x.id===c.dataset.copy);if(it)copy(notesText(it));return}
  const tj=e.target.closest('[data-tj]');if(tj){e.preventDefault();const el=document.getElementById(tj.dataset.tj);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}return}
  const j2=e.target.closest('[data-jump2]');if(j2){e.preventDefault();const id=j2.dataset.jump2;location.hash=j2.getAttribute('href');setTimeout(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');el.setAttribute('tabindex','-1');el.focus({preventScroll:true});setTimeout(()=>el.classList.remove('flash'),1600)}},400);return}
  const j=e.target.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);if(el){el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}return}
  const k=e.target.closest('.kwc');if(k){const box=k.closest('.q').querySelector('.kwdef');const on=k.getAttribute('aria-expanded')!=='true';k.closest('.kwl').querySelectorAll('.kwc').forEach(x=>x.setAttribute('aria-expanded','false'));if(on&&k.dataset.def){k.setAttribute('aria-expanded','true');box.innerHTML=`<b>${esc(k.textContent)}</b>: ${esc(k.dataset.def)}`;box.classList.add('on')}else box.classList.remove('on');return}
  if(!e.target.closest('#drawer')&&!e.target.closest('#map'))closeDrawer();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  const typing=/input|textarea|select/i.test((e.target.tagName||''));if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){const q=$('#q');if(q){e.preventDefault();q.focus()}}
  if(e.key==='0'||e.key==='h'){location.hash='#home';return}
    const n=['1','2','3','4','5','6'].indexOf(e.key);if(n>=0){location.hash='#'+PAGES[n][0]}
});


document.addEventListener('click',e=>{if(e.target.closest('#promise-ok')){store.set('promise-seen',true);const p=$('#promise');if(p)p.open=false}});
// ---- headline ticker + share
function ticker(){
  const ed=latestEd();if(!ed||!(ed.items||[]).length)return;if(ticker.done===ed.date)return;ticker.done=ed.date;
  const one=ed.items.map(it=>`<button data-tick="item-${esc(it.id)}">${esc(it.title)}</button>`).join('');
  $('#rail').innerHTML=one+one.replace(/<button /g,'<button tabindex="-1" aria-hidden="true" ');$('#ticker').hidden=false;
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tick]');if(!b)return;const go=()=>{const el=document.getElementById(b.dataset.tick);if(el){el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}};
    if(cur!=='edition'){location.hash='#edition';setTimeout(go,350)}else go()});
}
const SHARE_URL='https://style-watch.github.io/The-Mains-Gazette-/';
const SHARE_TEXT="The Mains Gazette: a companion to your daily newspaper for UPSC Mains, not a replacement. It picks the syllabus-relevant reads and saves the ideas, keywords, data and examples by theme, linked to past Mains questions, with an Essay Column and an Ethics Casebook.";
function closeShare(){const m=$('#sharemenu');if(m){m.hidden=true;$('#share').setAttribute('aria-expanded','false')}}
document.addEventListener('click',async e=>{
  const sb=e.target.closest('#share');const m=$('#sharemenu');
  if(sb){const open=m.hidden;m.hidden=!open;sb.setAttribute('aria-expanded',String(open));if(open)m.querySelector('a,button').focus();return}
  const it=e.target.closest('[data-sh]');
  if(it){const k=it.dataset.sh;
    if(k==='copy'){try{await navigator.clipboard.writeText(SHARE_URL);toast('Link copied')}catch(_){prompt('Copy this link',SHARE_URL)}}
    if(k==='more'){try{await navigator.share({title:'The Mains Gazette',text:SHARE_TEXT,url:SHARE_URL})}catch(_){}}
    closeShare();return}
  if(m&&!m.hidden&&!e.target.closest('#sharemenu'))closeShare();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare()});

// ---- dateline: Vol. (year of publication) · No. (edition count) · today's date
function dateline(){
  const n=IDX.editions.length,start=n?IDX.editions.map(e=>e.date).sort()[0].slice(0,4):String(new Date().getFullYear());
  const vol=['I','II','III','IV','V','VI','VII','VIII','IX','X'][Math.max(0,new Date().getFullYear()-(+start))]||'I';
  $('#dl-vol').textContent=`Vol. ${vol} · No. ${n||'—'}`;
  $('#dl-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
// ---- router (plain #name hashes so links work everywhere)
let cur='home';
route.n=0;
// Fetch only what the requested page needs, then draw it.
async function prepare(h){
  let m;const need=[];
  if(!IDX.latest&&!prepare.idx){prepare.idx=1;await loadIndex()}
  if(IDX.latest)need.push(loadDay(IDX.latest));
  if((m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/)))need.push(loadDay(m[1]));
  if((m=h.match(/^theme-([a-z0-9]+)/)))need.push(loadTheme(m[1]));
  if((m=h.match(/^essay-([a-z]+)$/)))need.push(loadEssay(m[1]));
  if(h==='clippings')[...new Set([...SAVED].map(id=>String(id).slice(0,10)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].forEach(d=>need.push(loadDay(d).catch(()=>null)));
  await Promise.all(need);
}
async function route(){
  const h=(location.hash||'#home').slice(1);closeDrawer();
  const my=route.seq=(route.seq||0)+1;
  const slow=setTimeout(()=>{if(my===route.seq)$('#main').innerHTML='<div class="wrap"><div class="nothing" style="margin:40px 0">Loading…</div></div>'},250);
  try{await prepare(h)}catch(e){clearTimeout(slow);if(my!==route.seq)return;$('#main').innerHTML='<div class="wrap"><div class="nothing" style="margin:40px 0">This page could not be loaded. Check your internet connection and try again.<br><br><button class="btn" onclick="location.reload()">Try again</button></div></div>';return}
  clearTimeout(slow);if(my!==route.seq)return;
  let m;const G='The Mains Gazette';
  if(h==='home'){cur='home';viewHome();document.title=G+' · Today\'s news, tomorrow\'s answers'}
  else if(h==='edition'){cur='edition';viewDossier();document.title='Morning Edition · '+G}
  else if(h==='almanac-all'){cur='almanac';viewAllThemes();document.title='All themes · The Almanac · '+G}
  else if(h==='paper-essay'){cur='almanac';viewEssayPaper();document.title='Essay · The Almanac · '+G}
  else if((m=h.match(/^paper-(gs[1-4])$/))){cur='almanac';viewPaper(m[1]);document.title=m[1].toUpperCase()+' · The Almanac · '+G}
  else if(h==='almanac'){cur='almanac';viewVault();document.title='The Almanac · '+G}
  else if(h==='ethics'){cur='ethics';viewCasebook();document.title='The Ethics Casebook · '+G}
  else if(h==='essay'){cur='essay';viewEssay();document.title='The Essay Column · '+G}
  else if((m=h.match(/^essay-([a-z]+)$/))){cur='essay';viewEssayTheme(m[1]);document.title='Essay: '+(ETH[m[1]]?ETH[m[1]].n:'')+' · '+G}
  else if(h==='index'){cur='index';viewMap();document.title='PYQ Index · '+G}
  else if(h==='clippings'){cur='clippings';viewSaved();document.title='Clippings · '+G}
  else if((m=h.match(/^restore=([0-9A-Za-z.~]*)$/))){cur='clippings';viewRestore(m[1]);document.title='Restore clippings · '+G}
  else if((m=h.match(/^theme-([a-z0-9]+)(?:-(pyq|cards))?$/))){cur='almanac';viewTheme(m[1],m[2]);document.title=(TH[m[1]]?TH[m[1]].n+' · ':'')+G}
  else if((m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/))){cur='edition';viewDossier(m[1]);document.title='Morning Edition · '+G}
  else{cur='home';viewHome();document.title=G+' · Today\'s news, tomorrow\'s answers'}
  dateline();ticker();
  $('#sh-wa').href='https://wa.me/?text='+encodeURIComponent(SHARE_TEXT+' '+SHARE_URL);
  $('#sh-tg').href='https://t.me/share/url?url='+encodeURIComponent(SHARE_URL)+'&text='+encodeURIComponent(SHARE_TEXT);
  if(navigator.share)$('#sh-more').hidden=false;
  nav(cur);window.scrollTo(0,0);
  // screen readers: announce the new page by moving focus to its heading
  if(route.n++){const h1=document.querySelector('#main h1');if(h1){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true})}}
}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
