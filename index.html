<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mains Gazette</title>
<meta name="description" content="The Mains Gazette: read the newspaper the UPSC Mains way. The Morning Edition turns each news item into Ideas, Keywords, Data and Examples; The Almanac files them under priority themes drawn from every GS 1–3 Mains question, 2013–2026.">
<meta name="theme-color" content="#14213D">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Mains Gazette">
<meta property="og:title" content="The Mains Gazette · Today's news, tomorrow's answers">
<meta property="og:description" content="UPSC Mains current affairs, the newspaper way: daily Ideas, Keywords, Data and Examples, linked to every GS question since 2013, plus an Essay Column and an Ethics Casebook.">
<meta property="og:url" content="https://style-watch.github.io/stylewatch.github.io/mainsgazette/">
<meta property="og:image" content="https://style-watch.github.io/stylewatch.github.io/mainsgazette/icons/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://style-watch.github.io/stylewatch.github.io/mainsgazette/icons/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F3;--card:#FFFFFF;--ink:#111827;--muted:#5B6474;--soft:#8A93A3;--line:#E8E3D8;--line2:#F1EDE4;
  --navy:#14213D;--navy2:#22335A;--saffron:#D97706;--saffron2:#F59E0B;
  --ideas:#4F46E5;--kw:#B45309;--data:#0F766E;--ex:#BE185D;
  --gs1:#0E7490;--gs2:#4338CA;--gs3:#15803D;--gs4:#9D174D;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:16px;--shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--saffron2);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(250,248,243,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none}
.brand svg{width:38px;height:38px}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-family:var(--serif);font-weight:700;font-size:1.42rem;letter-spacing:-.01em;color:var(--navy)}
.word small.pre{margin:0 0 1px;font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--saffron);display:block}
.word b i{font-style:normal;color:var(--saffron)}
.word small{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav.main{margin-left:auto;display:flex;gap:4px;align-items:center}
nav.main a{text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:10px;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:center}
nav.main a:hover{color:var(--ink);background:#fff}
nav.main a[aria-current=page]{color:var(--navy);background:#fff;box-shadow:inset 0 -2px 0 var(--saffron)}
nav.main .n{font-family:var(--mono);font-size:.7rem;background:var(--navy);color:#fff;border-radius:99px;padding:1px 7px}
.tabbar{display:none}
@media (max-width:820px){
  nav.main{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current=page]{color:var(--navy);background:var(--paper)}
  body{padding-bottom:76px}
  .word small{display:none}
}

/* ethics casebook */
.ecase{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gs4);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ecase .ar{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gs4);font-weight:600}
.ecase h4{margin:0;font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.3}
.ecase p{margin:0;font-size:.92rem;color:#374151}
.ecase .ls{background:#FDF2F8;border-radius:8px;padding:8px 10px;font-size:.9rem}
.ecase .ls b{color:var(--gs4)}
.ecase .vs{display:flex;flex-wrap:wrap;gap:6px}
.ecase .vs span{font-size:.74rem;font-weight:600;background:#F3F4F6;border-radius:99px;padding:3px 9px;color:#374151}
.ecase .ft2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line)}
.ecase .src{font-size:.76rem;color:var(--soft)}
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.egrid{grid-template-columns:1fr}}
.eband{margin-top:34px;padding:20px;border-radius:18px;background:#FDF2F8;border:1px solid #FBCFE8}
.eband .secth{margin:0 0 14px}
.eband .secth h2{color:var(--gs4)}
.cbk{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#FDF2F8;border:1px solid #FBCFE8;border-radius:16px;padding:14px 18px;margin-bottom:18px;text-decoration:none;color:inherit}
.cbk b{font-family:var(--serif);font-size:1.15rem;color:var(--gs4)}
.cbk span{font-size:.9rem;color:#374151}
.egrp{margin-top:26px}
.egrp h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 4px;color:var(--gs4)}
.egrp .gd{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.where{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:#F5F7FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.84rem;color:#374151}
.where svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--navy)}
.where b{color:var(--navy)}
.where a{color:var(--saffron);font-weight:600}
/* essay column */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;box-shadow:var(--shadow)}
.note b{display:block;font-family:var(--serif);font-size:1.08rem;font-weight:600;margin-bottom:6px;line-height:1.25}
.note p{margin:0;font-size:.9rem;color:#374151}
.note i{position:absolute;top:12px;right:14px;font-family:var(--serif);font-style:normal;font-size:1.6rem;color:var(--line)}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
.bars{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 6px;box-shadow:var(--shadow)}
.bar{display:grid;grid-template-columns:minmax(0,280px) 1fr 150px;gap:14px;align-items:center;padding:8px 12px;border-radius:10px;text-decoration:none}
.bar:hover{background:var(--paper)}
.bar .nm{font-weight:600;font-size:.93rem}
.bar .tr{height:14px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .tr i.n{background:var(--saffron)}.bar .tr i.o{background:#F8D9A8}
.bar .ct{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right}
@media (max-width:700px){.bar{grid-template-columns:1fr;gap:4px}.bar .ct{text-align:left}}
.wall{display:grid;gap:12px}
.wyr{display:grid;grid-template-columns:70px 1fr 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wyr>b{font-family:var(--serif);font-size:1.4rem;color:var(--navy)}
.wyr h5{margin:0 0 6px;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;color:var(--soft);font-weight:500}
.wyr ul{margin:0;padding:0;list-style:none}
.wyr li{font-size:.9rem;padding:4px 0;border-top:1px solid var(--line2)}
.wyr li:first-child{border-top:0}
.wyr li a{font-size:.68rem;font-weight:600;text-decoration:none;color:var(--navy);background:#EEF1F8;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
@media (max-width:760px){.wyr{grid-template-columns:1fr}}
.fod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fd{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.fd .ty{display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff}
.ty.Story{background:#7C3AED}.ty.Quote{background:#B45309}.ty.Example{background:#0F766E}.ty.Data{background:#1D4ED8}.ty.Book{background:#BE185D}.ty.Phrase{background:#475569}
.fd h4{margin:0;font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.3}
.fd p{margin:0;font-size:.92rem;color:#374151}
.fd .use{background:#FFF8EC;border-left:3px solid var(--saffron);padding:8px 10px;border-radius:0 8px 8px 0;font-size:.88rem}
.fd .use b{color:#7C3A06}
.fd .rel{font-size:.82rem;color:var(--muted)}
.fd .rel q{font-style:italic;color:#374151}
.fd .ft2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.fd .src{font-size:.76rem;color:var(--soft)}
@media (max-width:760px){.fod{grid-template-columns:1fr}}
.secth{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:34px 0 12px}
.secth h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0}
.secth span{color:var(--muted);font-size:.88rem}

/* headline ticker */
.ticker{background:var(--navy);color:#FAF8F3;overflow:hidden;position:relative}
.ticker .wrap{display:flex;align-items:center;gap:14px;padding-top:7px;padding-bottom:7px}
.ticker .lbl{flex:none;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;background:var(--saffron);color:var(--navy);font-weight:700;padding:3px 8px;border-radius:5px}
.ticker .vp{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .rail{display:flex;gap:34px;width:max-content;animation:tick 90s linear infinite}
.ticker:hover .rail,.ticker:focus-within .rail{animation-play-state:paused}
.ticker button{all:unset;cursor:pointer;font-size:.86rem;white-space:nowrap}
.ticker button:hover,.ticker button:focus-visible{color:var(--saffron);text-decoration:underline}
.ticker button::before{content:'◆';color:var(--saffron);font-size:.6rem;margin-right:10px;vertical-align:2px}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .vp{overflow-x:auto}}
.share{display:inline-flex;align-items:center;gap:6px;flex:none;border:0;cursor:pointer;background:var(--navy);color:#fff;font:600 .84rem var(--sans,Inter),sans-serif;padding:8px 14px;border-radius:999px}
.share:hover{background:var(--saffron);color:var(--navy)}
.share svg{width:16px;height:16px}
@media (max-width:600px){.share span{display:none}.share{padding:9px;margin-left:auto}}
/* dateline under the masthead */
.dateline{border-bottom:3px double var(--navy);background:var(--paper)}
.dateline .wrap{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:6px;padding-bottom:6px}
@media (max-width:600px){.dateline .hide-s{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.hero .wrap{position:relative;padding-top:44px;padding-bottom:40px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--saffron2)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1.05;margin:10px 0 12px;letter-spacing:-.015em;max-width:20ch}
.hero p.sub{color:#C9D2E3;max-width:62ch;margin:0;font-size:1.02rem}
.lenses{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.lens{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:.86rem;font-weight:600}
.lens i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:.7rem;font-family:var(--mono);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:26px;background:rgba(255,255,255,.12);border-radius:14px;overflow:hidden;max-width:760px}
.stats div{background:var(--navy2);padding:14px 16px}
.stats b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1}
.stats span{font-size:.78rem;color:#AEB9CF}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* common */
section.block{padding:30px 0}
.h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#D6CFC0}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.gs{display:inline-flex;align-items:center;font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.04em;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.gs.GS1{background:var(--gs1)}.gs.GS2{background:var(--gs2)}.gs.GS3{background:var(--gs3)}.gs.GS4{background:var(--gs4)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;font:inherit;padding:11px 0;min-width:0;color:var(--ink)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--navy)}
.search kbd,.kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--soft);background:var(--paper)}
select.sel{font:inherit;font-size:.88rem;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#CFC7B6}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn svg{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:#C9D2E3;text-decoration:none;font-size:.88rem;font-weight:600}
.back:hover{color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* heat strip */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.heat i{height:16px;border-radius:3px;background:var(--line2)}
.heat i.l1{background:#FDE7C2}.heat i.l2{background:#F8BF6B}.heat i.l3{background:#E58A14}.heat i.l4{background:#9A4E06}
.heatlbl{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;font-family:var(--mono);font-size:.6rem;color:var(--soft);margin-top:4px;text-align:center}

/* edition contents */
.toc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:0 0 18px;box-shadow:var(--shadow)}
.toc summary{cursor:pointer;font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:28px}
.toc li{break-inside:avoid}
.toc button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:6px 4px;border-radius:8px;cursor:pointer}
.toc button:hover{background:var(--paper)}
.toc .tn{font-family:var(--mono);font-size:.72rem;color:var(--soft)}
.toc .tt{flex:1;font-size:.9rem;font-weight:600;line-height:1.35}
.toc .tg{display:flex;gap:3px;flex:none}
.toc .tg .gs{font-size:.6rem;padding:1px 5px}
@media (max-width:760px){.toc ol{columns:1}}
.card.flash{box-shadow:0 0 0 3px var(--saffron2),var(--shadow);transition:box-shadow .3s}
/* dossier */
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.date{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;cursor:pointer;text-decoration:none;min-width:84px}
.date b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1.1}
.date span{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.date[aria-current=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.date[aria-current=true] span{color:#C9D2E3}
.edhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;justify-content:space-between;margin:22px 0 14px}
.edhead h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0}
.edhead .meta{color:var(--muted);font-size:.9rem}
.cards{display:grid;gap:18px}
.card{scroll-margin-top:84px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .hd{padding:18px 20px 12px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.card .path{font-size:.8rem;color:var(--muted);font-weight:500}
.card h3{font-family:var(--serif);font-weight:600;font-size:1.32rem;line-height:1.25;margin:0 0 6px;letter-spacing:-.005em}
.card .ctx{margin:0;color:#374151}
.card .src{font-size:.8rem;color:var(--soft);margin-top:6px}
.card .src a{color:var(--muted)}
.matrix{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.q{padding:14px 20px 16px;border-bottom:1px solid var(--line2);min-width:0}
.q:nth-child(odd){border-right:1px solid var(--line2)}
.q h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono);font-weight:500}
.q h4 i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.72rem}
.q.ideas h4{color:var(--ideas)}.q.ideas h4 i{background:var(--ideas)}
.q.kw h4{color:var(--kw)}.q.kw h4 i{background:var(--kw)}
.q.data h4{color:var(--data)}.q.data h4 i{background:var(--data)}
.q.ex h4{color:var(--ex)}.q.ex h4 i{background:var(--ex)}
.q ul{margin:0;padding-left:18px}
.q li{margin:4px 0}
.kwl{display:flex;flex-wrap:wrap;gap:6px}
.kwc{border:1px solid #F3D9B0;background:#FFF8EC;color:#7C3A06;border-radius:8px;padding:3px 9px;font-size:.86rem;font-weight:600;cursor:help;position:relative}
.kwc[aria-expanded=true]{background:#7C3A06;color:#fff;border-color:#7C3A06}
.kwdef{margin-top:8px;font-size:.88rem;color:#4B5563;background:#FFF8EC;border-radius:8px;padding:8px 10px;display:none}
.kwdef.on{display:block}
.fig{display:flex;gap:10px;align-items:baseline;margin:6px 0}
.fig b{font-family:var(--serif);font-weight:700;color:var(--data);font-size:1.15rem;white-space:nowrap}
.fig span{font-size:.9rem}
.fig small{color:var(--soft);display:block;font-size:.76rem}
.exi{margin:6px 0}
.exi b{font-weight:600}
.exi .gs{margin-left:6px;vertical-align:1px}
.exi span{color:#4B5563;font-size:.9rem}
.exi span.gs{color:#fff;font-size:.7rem}
.ft{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:#FCFBF8}
.tlinks{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tlink{font-size:.8rem;font-weight:600;text-decoration:none;color:var(--navy);background:#EEF1F8;border-radius:8px;padding:3px 9px}
.tlink:hover{background:#DFE5F3}
.wfit{border-top:1px solid var(--line);padding:14px 20px 16px;background:#F5F7FC}
.wfit h5{margin:0 0 8px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:600}
.wfit ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.wfit li{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.wfit .pq{display:flex;gap:8px;align-items:baseline;font-weight:600;font-size:.9rem}
.wfit .pu{font-size:.86rem;color:#374151;margin-top:3px}
.wfit .pu b{color:var(--saffron)}
.wfit .nt{font-size:.74rem;color:var(--soft);margin-top:8px}
.srcn{font-size:.8rem;color:var(--muted);background:#FFF8EC;border-radius:8px;padding:6px 10px;margin:0 20px 12px}
.asked{border-top:1px dashed var(--line);padding:10px 20px 14px;background:#FCFBF8;font-size:.86rem}
.asked summary{cursor:pointer;font-weight:600;color:var(--muted)}
.asked ul{margin:8px 0 0;padding-left:0;list-style:none}
.asked li{margin:5px 0;display:flex;gap:8px;align-items:baseline}
.code{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.matrix{grid-template-columns:1fr}.q:nth-child(odd){border-right:0}.tlinks{flex-basis:100%}.ft{padding:12px 16px}.card .hd,.q{padding-left:16px;padding-right:16px}}

/* empty state */
.empty{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--serif);font-weight:600;font-size:1.7rem;margin:0 0 8px;line-height:1.15}
.steps{counter-reset:s;list-style:none;padding:0;margin:16px 0 0}
.steps li{counter-increment:s;display:flex;gap:12px;margin:12px 0;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem}
.anat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.anat div{border-radius:14px;padding:14px;color:#fff;min-height:118px;position:relative;overflow:hidden}
.anat b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:4px}
.anat span{font-size:.84rem;opacity:.92}
.anat div::after{content:attr(data-k);position:absolute;right:10px;bottom:-14px;font-family:var(--serif);font-size:4.6rem;font-weight:700;opacity:.14}
@media (max-width:820px){.empty{grid-template-columns:1fr;padding:20px}}

/* vault */
.grp{margin:28px 0 10px;display:flex;align-items:center;gap:12px}
.grp h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500;white-space:nowrap}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(17,24,39,.05),0 14px 32px rgba(17,24,39,.09)}
.tile .rk{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:.68rem;color:var(--soft)}
.tile h4{font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.25;margin:0 0 4px;padding-right:34px}
.tile .pl{font-size:.76rem;color:var(--muted);margin-bottom:12px}
.tile .nums{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:.8rem;color:var(--muted)}
.tile .nums b{color:var(--ink);font-weight:700}
.tile .ent{font-weight:600;color:var(--navy)}
.tile .ent.zero{color:var(--soft);font-weight:500}
.prio{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.prio.p3{background:#9A4E06;color:#fff}.prio.p2{background:#F8BF6B;color:#5B2C04}.prio.p1{background:var(--line2);color:var(--muted)}

/* theme page */
.thhead h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.1;margin:12px 0 6px}
.thhead .pl{color:#C9D2E3}
.bigheat{margin-top:22px;max-width:640px}
.bigheat .heat i{height:30px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:#fff;font-style:normal}
.bigheat .heat i.l1,.bigheat .heat i.l2{color:#5B2C04}
.bigheat .heat i.l0{background:rgba(255,255,255,.08);color:transparent}
.bigheat .heatlbl{color:#AEB9CF}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--saffron)}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sheet .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sheet .box h4{margin:0 0 10px;font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;display:flex;gap:8px;align-items:center}
.sheet .box h4 i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.72rem}
.sheet .row{padding:7px 0;border-top:1px solid var(--line2);font-size:.92rem}
.sheet .row:first-of-type{border-top:0}
.sheet .row .when{font-family:var(--mono);font-size:.68rem;color:var(--soft);display:block;margin-top:2px}
.sheet .row .when a{color:var(--soft)}
@media (max-width:760px){.sheet{grid-template-columns:1fr}}
.pyqs{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pyqs .yr{display:grid;grid-template-columns:76px 1fr;border-top:1px solid var(--line2)}
.pyqs .yr:first-child{border-top:0}
.pyqs .yr>b{font-family:var(--serif);font-size:1.25rem;padding:14px 0 0 18px;color:var(--navy)}
.pyqs ul{list-style:none;margin:0;padding:10px 18px 10px 0}
.pyqs li{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.pyqs li .gs{flex:none}
.note{font-size:.82rem;color:var(--muted);margin-top:12px}
.nothing{background:#fff;border:1px dashed #D6CFC0;border-radius:16px;padding:22px;color:var(--muted);text-align:center}

/* pyq map */
.mapwrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table.map{border-collapse:separate;border-spacing:0;width:100%;font-size:.84rem}
.map th,.map td{padding:0}
.map thead th{position:sticky;top:0;background:#fff;z-index:2;font-family:var(--mono);font-size:.66rem;color:var(--muted);font-weight:500;padding:10px 2px;border-bottom:1px solid var(--line)}
.map th.tn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;font-weight:600;padding:5px 12px;white-space:nowrap;border-right:1px solid var(--line2);max-width:330px;overflow:hidden;text-overflow:ellipsis}
.map thead th.tn{z-index:3}
.map th.tn a{text-decoration:none}
.map th.tn a:hover{text-decoration:underline}
.map tr.gh th{background:var(--paper);text-align:left;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;position:sticky;left:0;font-weight:500}
.map td.c{text-align:center;padding:2px}
.map td.c button{width:100%;min-width:30px;height:26px;border:0;border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:.72rem;background:var(--line2);color:transparent}
.map td.c button.l1{background:#FDE7C2;color:#7C3A06}.map td.c button.l2{background:#F8BF6B;color:#5B2C04}.map td.c button.l3{background:#E58A14;color:#fff}.map td.c button.l4{background:#9A4E06;color:#fff}
.map td.c button:hover{outline:2px solid var(--navy)}
.map td.tot{font-family:var(--mono);font-size:.74rem;text-align:right;padding:0 12px;color:var(--muted)}
.drawer{position:fixed;inset:auto 0 0 0;max-height:62vh;overflow:auto;background:#fff;border-top:1px solid var(--line);box-shadow:0 -12px 40px rgba(17,24,39,.15);z-index:50;transform:translateY(calc(100% + 60px));visibility:hidden;transition:transform .25s,visibility .25s;border-radius:18px 18px 0 0}
.drawer.on{transform:none;visibility:visible}
.drawer .wrap{padding-top:18px;padding-bottom:28px}
.drawer h3{font-family:var(--serif);font-weight:600;margin:0 0 10px;font-size:1.25rem}
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.method div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.9rem;color:#374151}
.method b{display:block;font-family:var(--serif);font-size:1.02rem;margin-bottom:4px;color:var(--ink)}
@media (max-width:760px){.method{grid-template-columns:1fr}}
.legend{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);margin:0 0 12px}
.legend i{width:18px;height:12px;border-radius:3px;display:inline-block}

footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 30px;color:var(--muted);font-size:.84rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media print{.top,.tabbar,footer,.tool,.tabs,.ft .btn,.hero canvas{display:none!important}.hero{background:#fff;color:#000}.hero p.sub,.thhead .pl{color:#333}body{background:#fff}.card,.box{box-shadow:none;break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

<script>
(function(){
'use strict';
const MM=window.MM, D=(window.MM_DOSSIER||{editions:[]});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YEARS=MM.meta.years;
const TH={};MM.themes.forEach((t,i)=>{TH[t.k]=t;t.i=i;
  t.byYear=YEARS.map(y=>t.q.filter(id=>MM.pyq[id][1]===y).length);
  t.yrs=t.byYear.filter(Boolean).length;
  t.recent=t.byYear.slice(-5).filter(Boolean).length; // years asked among last 5 papers
  t.score=t.yrs*10+t.recent*6+t.q.length;
});
const ranked=[...MM.themes].sort((a,b)=>b.score-a.score);ranked.forEach((t,i)=>t.rank=i+1);
function prio(t){return t.rank<=15?3:(t.rank<=35?2:1)}
const PRIO=['','Steady','High','Top'];
function lvl(n){return n>=4?4:n>=3?3:n>=2?2:n>=1?1:0}

// ---- dossier index: every item, with edition reference
const ITEMS=[];D.editions.forEach(ed=>(ed.items||[]).forEach(it=>{it._ed=ed;ITEMS.push(it)}));
const byTheme={};ITEMS.forEach(it=>(it.themes||[]).forEach(k=>{(byTheme[k]=byTheme[k]||[]).push(it)}));

// ---- storage (per viewer, optional)
const store={get(k,d){try{const v=localStorage.getItem('mm-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mm-'+k,JSON.stringify(v))}catch(e){}}};
let SAVED=new Set(store.get('saved',[]));

// ---- icons
const IC={
 dossier:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
 vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>',
 map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 saved:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>'
};
const LENS={ideas:['I','Ideas','var(--ideas)','Perspectives and arguments, tied strictly to a syllabus line'],kw:['K','Keywords','var(--kw)','Terms that make an answer sharp'],data:['D','Data','var(--data)','Figures you can quote, with their source'],ex:['E','Examples','var(--ex)','Cases, initiatives and stories, including GS4 Ethics examples']};

// ---- nav
const PAGES=[['edition','Morning Edition','Edition'],['almanac','The Almanac','Almanac'],['essay','The Essay Column','Essay'],['index','PYQ Index','Index'],['clippings','Clippings','Clippings']];
function nav(cur){
  const ic={edition:IC.dossier,almanac:IC.vault,essay:IC.pen,index:IC.map,clippings:IC.saved};
  $('#nav').innerHTML=PAGES.map(([k,l])=>`<a href="#${k}" ${cur===k?'aria-current="page"':''}>${esc(l)}${k==='clippings'&&SAVED.size?`<span class="n">${SAVED.size}</span>`:''}</a>`).join('');
  $('#tabbar').innerHTML=PAGES.map(([k,,s])=>`<a href="#${k}" ${cur===k?'aria-current="page"':''}>${ic[k]}${esc(s)}</a>`).join('');
}

// ---- hero background: a gently drifting grid of matrix cells
function fx(){
  const c=$('#fx');if(!c)return;const ctx=c.getContext('2d');let w,h,cells=[],raf;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const r=c.getBoundingClientRect();w=c.width=r.width*devicePixelRatio;h=c.height=r.height*devicePixelRatio;cells=[];const s=34*devicePixelRatio;
    for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){if(Math.random()<.16)cells.push({x,y,s:s*.62,p:Math.random()*6.28,v:.004+Math.random()*.01,c:Math.random()<.18?'245,158,11':'255,255,255'})}}
  function draw(){ctx.clearRect(0,0,w,h);for(const k of cells){k.p+=k.v;const a=(Math.sin(k.p)+1)/2*.22+.03;ctx.fillStyle=`rgba(${k.c},${a})`;const r=4*devicePixelRatio;ctx.beginPath();ctx.roundRect?ctx.roundRect(k.x,k.y,k.s,k.s,r):ctx.rect(k.x,k.y,k.s,k.s);ctx.fill()}if(!reduce)raf=requestAnimationFrame(draw)}
  size();draw();window.addEventListener('resize',()=>{cancelAnimationFrame(raf);size();draw()},{once:true});
}

function heatHTML(t,big){
  return `<div class="heat">${t.byYear.map((n,i)=>`<i class="l${lvl(n)}" title="${YEARS[i]}: ${n} question${n===1?'':'s'}">${big&&n?n:''}</i>`).join('')}</div><div class="heatlbl">${YEARS.map(y=>`<span>${big?"'"+String(y).slice(2):(y===2013||y===2026?"'"+String(y).slice(2):'')}</span>`).join('')}</div>`;
}
function gsChips(a){return (a||[]).map(g=>`<span class="gs ${esc(g)}">${esc(g)}</span>`).join('')}
function code(id){const [p,y,q]=MM.pyq[id];return `${p} · ${y}${q&&q!=='Q?'?' · '+q:''}`}
function fmtDate(s,o){try{return new Date(s+'T00:00:00').toLocaleDateString('en-IN',o||{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

// ---- card
function askedFor(it){
  const seen=new Set(),out=[];
  (it.themes||[]).forEach(k=>{const t=TH[k];if(!t)return;t.q.forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id)}})});
  out.sort((a,b)=>MM.pyq[b][1]-MM.pyq[a][1]);return out;
}
function cardHTML(it){
  const asked=askedFor(it).slice(0,4);
  const ideas=(it.ideas||[]),kw=(it.keywords||[]),data=(it.data||[]),ex=(it.examples||[]);
  const q=(k,body)=>`<div class="q ${k}"><h4><i>${LENS[k][0]}</i>${LENS[k][1]}</h4>${body||'<span class="code">—</span>'}</div>`;
  return `<article class="card" id="item-${esc(it.id)}">
  <div class="hd">
    <div class="tags">${gsChips(it.gs)}<span class="path">${esc(it.syllabus||'')}</span></div>
    <h3>${esc(it.title)}</h3>
    ${it.context?`<p class="ctx">${esc(it.context)}</p>`:''}

function notesText(it){
  const L=[];L.push(it.title.toUpperCase());L.push(`${(it.gs||[]).join(', ')} | ${it.syllabus||''}`);L.push(`${it.paper||it._ed.paper||''}${it.where?', '+it.where:''}, ${fmtDate(it._ed.date)}`);
  if(it.ideas&&it.ideas.length){L.push('\nIDEAS');it.ideas.forEach(x=>L.push('• '+x))}
  if(it.keywords&&it.keywords.length){L.push('\nKEYWORDS');it.keywords.forEach(x=>L.push('• '+x[0]+(x[1]?' — '+x[1]:'')))}
  if(it.data&&it.data.length){L.push('\nDATA');it.data.forEach(x=>L.push('• '+x[0]+' — '+(x[1]||'')+(x[2]?' ('+x[2]+')':'')))}
  if(it.pyqs&&it.pyqs.length){L.push('\nASKED BEFORE IN MAINS');it.pyqs.forEach(p=>{if(MM.pyq[p[0]])L.push('• '+code(p[0])+' '+MM.pyq[p[0]][3]+' — use: '+p[1])})}
  if(it.examples&&it.examples.length){L.push('\nEXAMPLES');it.examples.forEach(x=>L.push('• '+x[0]+(x[2]==='GS4'?' [GS4]':'')+(x[1]?' — '+x[1]:'')))}
  L.push('\nThemes: '+(it.themes||[]).filter(k=>TH[k]).map(k=>TH[k].n).join('; '));
  return L.join('\n');
}

function viewSaved(){
  const items=ITEMS.filter(it=>SAVED.has(it.id));
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap"><div class="eyebrow">Clippings</div><h1>Your cut-outs for revision.</h1><p class="sub">Cards you clip stay on this device and in this browser.</p></div></div><div class="wrap"><section class="block">${items.length?`<div class="cards">${items.map(cardHTML).join('')}</div>`:`<div class="nothing">No clippings yet. Use <b>Clip</b> on any Morning Edition card.</div>`}</section></div>`;fx();
}



// ---- The Ethics Casebook (GS4)
const EAREA={env:['Environmental ethics','Our duties to nature and to those who share it: pollution, waste, land and water.'],justice:['Climate and global justice','Fairness between nations and generations.'],public:['Public service ethics','Integrity, impartiality and the use of power by those who serve the public.'],care:['Ethics of care and compassion','Dignity of the vulnerable: the old, the sick, those in danger.'],gender:['Gender justice','Equity that starts by seeing women\'s invisible burdens.'],lives:['Lessons from lives','Values shown by real people: sacrifice, courage, magnanimity.']};
const CASES=[];(D.editions||[]).forEach(ed=>(ed.ethics||[]).forEach((c,i)=>{c._ed=ed;c._id=ed.date+'-e'+i;CASES.push(c)}));
CASES.sort((a,b)=>b._ed.date<a._ed.date?-1:b._ed.date>a._ed.date?1:0);
function ecaseHTML(c,showDate){
  const A=EAREA[c.area]||[c.area,''];
  return `<article class="ecase" data-area="${esc(c.area)}"><span class="ar">${esc(A[0])}</span><h4>${esc(c.title)}</h4><p>${esc(c.case)}</p>
   <div class="ls"><b>Ethical lesson:</b> ${esc(c.lesson)}</div><div class="vs">${(c.values||[]).map(v=>`<span>${esc(v)}</span>`).join('')}</div>
   <div class="ft2"><span class="src">${esc(c.src||'')}${showDate?' · '+esc(fmtDate(c._ed.date,{day:'numeric',month:'short',year:'numeric'})):''}</span><span>
   ${c.card?(showDate?`<a class="btn" href="#day-${c._ed.date}">GS card</a>`:`<button class="btn" data-jump="item-${esc(c.card)}">GS card</button>`):''}
   <button class="btn" data-ccopy="${esc(c._id)}">${IC.copy}Copy</button></span></div></article>`;
}
function viewCasebook(){
  const areas=Object.keys(EAREA).filter(a=>CASES.some(c=>c.area===a));
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap">
   <a class="back" href="#almanac">← The Almanac</a><div class="eyebrow">The Ethics Casebook · GS4</div>
   <h1>Real cases for the Ethics paper.</h1>
   <p class="sub">Every edition adds examples from the news, sorted by area of applied ethics. Each case gives the facts as reported, the ethical lesson, and the values it shows, ready for GS4 answers and case studies.</p>
   <div class="stats"><div><b>${CASES.length}</b><span>cases filed</span></div><div><b>${areas.length}</b><span>areas of ethics</span></div><div><b>${new Set(CASES.map(c=>c._ed.date)).size}</b><span>editions</span></div></div>
  </div></div><div class="wrap"><section class="block">
   <div class="tool"><div class="chips" id="ear"><button class="chip" aria-pressed="true" data-a="">All</button>${areas.map(a=>`<button class="chip" aria-pressed="false" data-a="${a}">${esc(EAREA[a][0])}</button>`).join('')}</div></div>
   ${areas.map(a=>{const cs=CASES.filter(c=>c.area===a);return `<div class="egrp" data-g="${a}"><h3>${esc(EAREA[a][0])} <span class="code">${cs.length}</span></h3><p class="gd">${esc(EAREA[a][1])}</p><div class="egrid">${cs.map(c=>ecaseHTML(c,true)).join('')}</div></div>`}).join('')||'<div class="nothing">Cases appear here with each edition.</div>'}
  </section></div>`;fx();
  $('#ear').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('#ear .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.egrp').forEach(g=>g.hidden=!!b.dataset.a&&g.dataset.g!==b.dataset.a)});
}

// ---- The Essay Column
const E=window.MM_ESSAY||{topics:{},themes:[],notes:[],fodder:[]};
const ETH={};E.themes.forEach(t=>{ETH[t.k]=t;t.newQ=[];t.oldQ=[]});
Object.entries(E.topics).forEach(([id,[y,sec,txt,ths]])=>ths.forEach(k=>{if(ETH[k])(y>=2020?ETH[k].newQ:ETH[k].oldQ).push(id)}));
E.themes.forEach(t=>t.score=t.newQ.length*3+t.oldQ.length);
const FOD=[];(E.fodder||[]).forEach(ed=>(ed.items||[]).forEach(it=>{it._ed=ed;FOD.push(it)}));
function etopic(id){const t=E.topics[id];return t?t[2]:''}
function fodHTML(it){
  const rel=(it.topics||[]).filter(id=>E.topics[id]).map(id=>`<q>${esc(etopic(id))}</q> <span class="code">${E.topics[id][0]}</span>`).join('; ');
  return `<article class="fd" data-ty="${esc(it.type)}" data-th="${esc((it.themes||[]).join(' '))}">
   <span class="ty ${esc(it.type)}">${esc(it.type)}</span>
   <h4>${esc(it.title)}</h4><p>${esc(it.text)}</p>
   <div class="use"><b>Use it for:</b> ${esc(it.use)}</div>
   ${rel?`<div class="rel">Fits past topics: ${rel}</div>`:''}
   <div class="ft2"><div class="tlinks">${(it.themes||[]).filter(k=>ETH[k]).map(k=>`<a class="tlink" href="#essay-${k}">${esc(ETH[k].n)}</a>`).join('')}</div>
   <span class="src">${esc(it.src||'')} · ${esc(fmtDate(it._ed.date,{day:'numeric',month:'short'}))}</span>
   <button class="btn" data-ecopy="${esc(it.id)}">${IC.copy}Copy</button></div></article>`;
}
function viewEssay(){
  const since=Object.values(E.topics).filter(t=>t[0]>=2020).length,tot=Object.keys(E.topics).length;
  const ranked=[...E.themes].sort((a,b)=>b.score-a.score),max=ranked[0]?ranked[0].score:1;
  const years=[...new Set(Object.values(E.topics).map(t=>t[0]))].filter(y=>y>=2020).sort((a,b)=>b-a);
  const latest=(E.fodder||[]).slice().sort((a,b)=>b.date<a.date?-1:1)[0];
  const types=['All',...new Set(FOD.map(f=>f.type))];
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap">
   <div class="eyebrow">The Essay Column</div>
   <h1>Ideas that outlive the news.</h1>
   <p class="sub">Essay topics since 2020 are philosophical. This page maps what UPSC keeps asking, and every day collects the stories, quotes, examples and data from the paper that can carry those essays.</p>
   <div class="stats"><div><b>${tot}</b><span>essay topics, 2013–2026</span></div><div><b>${since}</b><span>since 2020 (weighted ×3)</span></div><div><b>${E.themes.length}</b><span>essay themes</span></div><div><b>${FOD.length}</b><span>pieces of essay material</span></div></div>
  </div></div><div class="wrap"><section class="block">
   <div class="secth"><h2>Reading the pattern</h2><span>Editor's notes from analysing the essay papers</span></div>
   <div class="notes">${E.notes.map((n,i)=>`<div class="note"><i>${i+1}</i><b>${esc(n.h)}</b><p>${esc(n.t)}</p></div>`).join('')}</div>

   <div class="secth"><h2>Where the essays come from</h2><span><i style="display:inline-block;width:12px;height:10px;background:var(--saffron);border-radius:3px"></i> 2020–2026 (×3) &nbsp; <i style="display:inline-block;width:12px;height:10px;background:#F8D9A8;border-radius:3px"></i> 2013–2019</span></div>
   <div class="bars">${ranked.map(t=>`<a class="bar" href="#essay-${t.k}"><span class="nm">${esc(t.n)}</span><span class="tr"><i class="n" style="width:${t.newQ.length*3/max*100}%"></i><i class="o" style="width:${t.oldQ.length/max*100}%"></i></span><span class="ct">${t.newQ.length} since 2020 · ${t.oldQ.length} before</span></a>`).join('')}</div>
   <p class="note" style="box-shadow:none;margin-top:10px;font-size:.82rem;color:var(--muted)">A topic can belong to two themes. ${esc(E.source||'')}</p>

   <div class="secth"><h2>From today's paper: essay material</h2><span>${latest?esc(latest.paper)+' · '+esc(fmtDate(latest.date)):''}</span></div>
   <div class="tool"><div class="chips" id="ety">${types.map((t,i)=>`<button class="chip" aria-pressed="${i===0}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
   <select class="sel" id="eth" aria-label="Filter by theme"><option value="">All themes</option>${E.themes.map(t=>`<option value="${t.k}">${esc(t.n)}</option>`).join('')}</select></div>
   <div class="fod" id="fod">${FOD.map(fodHTML).join('')||'<div class="nothing">Essay material appears here with each edition.</div>'}</div>

   <div class="secth"><h2>The topic wall, 2020–2026</h2><span>Every essay topic set since 2020, with its themes</span></div>
   <div class="wall">${years.map(y=>{const ids=Object.keys(E.topics).filter(id=>E.topics[id][0]===y);const col=sec=>ids.filter(id=>E.topics[id][1]===sec).map(id=>`<li>${esc(E.topics[id][2])} ${E.topics[id][3].map(k=>`<a href="#essay-${k}">${esc(ETH[k]?ETH[k].n.split(/[,:&]/)[0]:k)}</a>`).join('')}</li>`).join('');return `<div class="wyr"><b>${y}</b><div><h5>SECTION A</h5><ul>${col('A')}</ul></div><div><h5>SECTION B</h5><ul>${col('B')}</ul></div></div>`}).join('')}</div>
  </section></div>`;
  fx();
  let ty='All';const run=()=>{const th=$('#eth').value;document.querySelectorAll('#fod .fd').forEach(c=>{c.hidden=!((ty==='All'||c.dataset.ty===ty)&&(!th||c.dataset.th.split(' ').includes(th)))})};
  $('#ety').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;ty=b.dataset.t;document.querySelectorAll('#ety .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));run()});
  $('#eth').addEventListener('change',run);
}
function viewEssayTheme(k){
  const t=ETH[k];if(!t){location.hash='#essay';return}
  const items=FOD.filter(f=>(f.themes||[]).includes(k));
  const li=ids=>ids.sort((a,b)=>E.topics[b][0]-E.topics[a][0]).map(id=>`<li style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2)"><span class="code">${E.topics[id][0]}${E.topics[id][1]!=='-'?' · '+E.topics[id][1]:''}</span><span>${esc(E.topics[id][2])}</span></li>`).join('');
  $('#main').innerHTML=`<div class="hero"><canvas id="fx" aria-hidden="true"></canvas><div class="wrap thhead">
   <a class="back" href="#essay">← The Essay Column</a><h1>${esc(t.n)}</h1><div class="pl">${esc(t.d)}</div>
   <div class="stats"><div><b>${t.newQ.length}</b><span>topics since 2020</span></div><div><b>${t.oldQ.length}</b><span>topics 2013–2019</span></div><div><b>${items.length}</b><span>pieces of material</span></div><div><b>#${[...E.themes].sort((a,b)=>b.score-a.score).indexOf(t)+1}</b><span>rank of ${E.themes.length}</span></div></div>
  </div></div><div class="wrap"><section class="block">
   <div class="note" style="margin-bottom:18px"><b>How to approach it</b><p>${esc(t.tip)}</p></div>
   <div class="sheet"><div class="box"><h4 style="color:var(--saffron)">Asked since 2020</h4><ul style="list-style:none;margin:0;padding:0">${li(t.newQ.slice())||'<span class="code">—</span>'}</ul></div>
   <div class="box"><h4 style="color:var(--muted)">Asked 2013–2019</h4><ul style="list-style:none;margin:0;padding:0;opacity:.8">${li(t.oldQ.slice())||'<span class="code">—</span>'}</ul></div></div>
   <div class="secth"><h2>Material collected</h2><span>Newest first, from each day's paper</span></div>
   <div class="fod">${items.slice().reverse().map(fodHTML).join('')||'<div class="nothing">Nothing filed under this theme yet.</div>'}</div>
  </section></div>`;fx();
}

// ---- global clicks: save, copy, keyword definitions
function copy(txt){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied to clipboard')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy not available here')}ta.remove()})}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-save]');if(s){const id=s.dataset.save;SAVED.has(id)?SAVED.delete(id):SAVED.add(id);store.set('saved',[...SAVED]);s.setAttribute('aria-pressed',SAVED.has(id));s.innerHTML=IC.saved+(SAVED.has(id)?'Clipped':'Clip');toast(SAVED.has(id)?'Clipped for revision':'Removed from Clippings');nav(cur);return}
  const cc=e.target.closest('[data-ccopy]');if(cc){const c=CASES.find(x=>x._id===cc.dataset.ccopy);if(c)copy(`GS4 ETHICS · ${(EAREA[c.area]||[c.area])[0]}\n${c.title}\n${c.case}\nEthical lesson: ${c.lesson}\nValues: ${(c.values||[]).join(', ')}\n(${c.src}, ${fmtDate(c._ed.date)})`);return}
  const ec=e.target.closest('[data-ecopy]');if(ec){const it=FOD.find(x=>x.id===ec.dataset.ecopy);if(it)copy(`${it.type.toUpperCase()}: ${it.title}\n${it.text}\nUse it for: ${it.use}\n(${it.src}, ${fmtDate(it._ed.date)})`);return}
  const c=e.target.closest('[data-copy]');if(c){const it=ITEMS.find(x=>x.id===c.dataset.copy);if(it)copy(notesText(it));return}
  const j=e.target.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);if(el){el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}return}
  const k=e.target.closest('.kwc');if(k){const box=k.closest('.q').querySelector('.kwdef');const on=k.getAttribute('aria-expanded')!=='true';k.closest('.kwl').querySelectorAll('.kwc').forEach(x=>x.setAttribute('aria-expanded','false'));if(on&&k.dataset.def){k.setAttribute('aria-expanded','true');box.innerHTML=`<b>${esc(k.textContent)}</b>: ${esc(k.dataset.def)}`;box.classList.add('on')}else box.classList.remove('on');return}
  if(!e.target.closest('#drawer')&&!e.target.closest('#map'))closeDrawer();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  const typing=/input|textarea|select/i.test((e.target.tagName||''));if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){const q=$('#q');if(q){e.preventDefault();q.focus()}}
  const n=['1','2','3','4','5'].indexOf(e.key);if(n>=0){location.hash='#'+PAGES[n][0]}
});


// ---- headline ticker + share
function ticker(){
  const eds=[...D.editions].sort((a,b)=>b.date<a.date?-1:1);const ed=eds[0];if(!ed||!(ed.items||[]).length)return;
  const one=ed.items.map(it=>`<button data-tick="item-${esc(it.id)}">${esc(it.title)}</button>`).join('');
  $('#rail').innerHTML=one+one.replace(/<button /g,'<button tabindex="-1" aria-hidden="true" ');$('#ticker').hidden=false;
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tick]');if(!b)return;const go=()=>{const el=document.getElementById(b.dataset.tick);if(el){el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}};
    if(cur!=='edition'){location.hash='#edition';setTimeout(go,350)}else go()});
}
const SHARE_URL='https://style-watch.github.io/stylewatch.github.io/mainsgazette/';
document.addEventListener('click',async e=>{if(!e.target.closest('#share'))return;
  const text="The Mains Gazette: UPSC Mains current affairs, the newspaper way. Daily Ideas, Keywords, Data and Examples, linked to past GS questions, plus an Essay Column and an Ethics Casebook.";
  try{if(navigator.share){await navigator.share({title:'The Mains Gazette',text,url:SHARE_URL});return}}catch(_){return}
  window.open('https://wa.me/?text='+encodeURIComponent(text+' '+SHARE_URL),'_blank','noopener');
});

// ---- dateline: Vol. (year of publication) · No. (edition count) · today's date
function dateline(){
  const n=D.editions.length,start=n?D.editions.map(e=>e.date).sort()[0].slice(0,4):String(new Date().getFullYear());
  const vol=['I','II','III','IV','V','VI','VII','VIII','IX','X'][Math.max(0,new Date().getFullYear()-(+start))]||'I';
  $('#dl-vol').textContent=`Vol. ${vol} · No. ${n||'—'}`;
  $('#dl-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
// ---- router (plain #name hashes so links work everywhere)
let cur='edition';
function route(){
  const h=(location.hash||'#edition').slice(1);closeDrawer();
  let m;const G='The Mains Gazette';
  if(h==='almanac'){cur='almanac';viewVault();document.title='The Almanac · '+G}
  else if(h==='ethics'){cur='almanac';viewCasebook();document.title='The Ethics Casebook · '+G}
  else if(h==='essay'){cur='essay';viewEssay();document.title='The Essay Column · '+G}
  else if((m=h.match(/^essay-([a-z]+)$/))){cur='essay';viewEssayTheme(m[1]);document.title='Essay: '+(ETH[m[1]]?ETH[m[1]].n:'')+' · '+G}
  else if(h==='index'){cur='index';viewMap();document.title='PYQ Index · '+G}
  else if(h==='clippings'){cur='clippings';viewSaved();document.title='Clippings · '+G}
  else if((m=h.match(/^theme-([a-z]+)(?:-(pyq|cards))?$/))){cur='almanac';viewTheme(m[1],m[2]);document.title=(TH[m[1]]?TH[m[1]].n+' · ':'')+G}
  else if((m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/))){cur='edition';viewDossier(m[1]);document.title='Morning Edition · '+G}
  else{cur='edition';viewDossier();document.title=G+' · Morning Edition'}
  dateline();ticker();
  nav(cur);window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
